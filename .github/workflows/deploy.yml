name: Doot Manual Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Explicitly authorize a production deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/doot-preservation-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const missing = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
            .filter((key) => !process.env[key]);
          if (missing.length) {
            console.error("Deployment blocked; missing GitHub secrets:", missing.join(", "));
            process.exit(1);
          }
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Run all tests
        run: npm test
      - name: Build production Worker and Wrangler config
        run: npm run build
      - name: Validate Nitro-generated Wrangler configuration
        id: config
        run: |
          set -euo pipefail
          mapfile -t configs < <(find .output -type f \( -name wrangler.json -o -name wrangler.jsonc \) -print)
          if [ "${#configs[@]}" -ne 1 ]; then
            echo "Expected exactly one Nitro-generated Wrangler config under .output; found ${#configs[@]}."
            find .output -maxdepth 4 -type f | head -80
            exit 1
          fi
          CONFIG="${configs[0]}"
          node --input-type=module - "$CONFIG" <<'NODE'
          import fs from "node:fs";
          const path = process.argv[2];
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const missing = ["name", "main", "compatibility_date"].filter(
            (key) => typeof config[key] !== "string" || !config[key].trim(),
          );
          if (missing.length) {
            console.error("Generated Wrangler config is incomplete:", missing.join(", "));
            process.exit(1);
          }
          if (!Array.isArray(config.ratelimits) ||
              !config.ratelimits.some((binding) => binding.name === "CHAT_RATE_LIMITER")) {
            console.error("Generated config is missing the CHAT_RATE_LIMITER binding.");
            process.exit(1);
          }
          console.log("Validated generated Worker config:", path);
          NODE
          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "${{ steps.config.outputs.path }}"
