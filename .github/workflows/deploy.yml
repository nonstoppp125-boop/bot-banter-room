name: Doot Manual Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Explicitly authorize a production deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/doot-preservation-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require explicit Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
          const missing = ["name", "main", "compatibility_date"].filter(
            (key) => typeof config[key] !== "string" || !config[key].trim(),
          );
          if (!process.env.CLOUDFLARE_API_TOKEN) missing.push("secret:CLOUDFLARE_API_TOKEN");
          if (!process.env.CLOUDFLARE_ACCOUNT_ID) missing.push("secret:CLOUDFLARE_ACCOUNT_ID");
          if (missing.length) {
            console.error("Deployment blocked; configure and verify:", missing.join(", "));
            process.exit(1);
          }
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Run all tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.json
