name: Group 03 Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Authorize deployment of the Group 03-only release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doot-group03-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_NAME CLOUDFLARE_D1_DATABASE_ID; do
            if [ -z "${!key:-}" ]; then echo "Missing required secret: $key"; exit 1; fi
          done
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production Worker
        run: npm run build
      - name: Locate generated Wrangler configuration
        id: config
        run: |
          set -euo pipefail
          mapfile -t configs < <(find .output -type f \( -name wrangler.json -o -name wrangler.jsonc \) -print)
          if [ "${#configs[@]}" -ne 1 ]; then
            echo "Expected exactly one generated Wrangler config; found ${#configs[@]}."
            exit 1
          fi
          echo "path=${configs[0]}" >> "$GITHUB_OUTPUT"
      - name: Inject production D1 binding (no migrations)
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/configure-production-d1.mjs "${{ steps.config.outputs.path }}"
      - name: Validate generated production configuration
        env:
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
          const d1 = (config.d1_databases ?? []).filter((item) => item.binding === "ACTION_DB");
          if (d1.length !== 1 || !d1[0].database_id || !d1[0].database_name) {
            throw new Error("ACTION_DB binding is missing or invalid.");
          }
          if (!Array.isArray(config.ratelimits) ||
              !config.ratelimits.some((item) => item.name === "CHAT_RATE_LIMITER")) {
            throw new Error("CHAT_RATE_LIMITER binding is missing.");
          }
          console.log("Validated ACTION_DB and CHAT_RATE_LIMITER bindings; migration step intentionally omitted.");
          NODE
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --config "${{ steps.config.outputs.path }}"
