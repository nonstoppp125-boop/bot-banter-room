name: Group 05 Production Release
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Authorize Group 05 production migration and deployment"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: doot-group05-production
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Require explicit Group 05 release approval
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_RELEASE" != "true" ]; then echo "Release not authorized."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          LIZA_AUTH_EMAIL: ${{ secrets.LIZA_AUTH_EMAIL }}
          LIZA_AUTH_PASSWORD_HASH: ${{ secrets.LIZA_AUTH_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_NAME CLOUDFLARE_D1_DATABASE_ID LIZA_AUTH_EMAIL LIZA_AUTH_PASSWORD_HASH; do
            if [ -z "${!key:-}" ]; then echo "Missing required secret: $key"; exit 1; fi
          done
          [[ "$LIZA_AUTH_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]
          hash_pattern='^pbkdf2\$100000\$[A-Za-z0-9_-]{22}\$[A-Za-z0-9_-]{43}$'
          [[ "$LIZA_AUTH_PASSWORD_HASH" =~ $hash_pattern ]]
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Group 05 release tests
        run: npm test -- --exclude src/test/task-approval.test.ts
      - name: Build production Worker
        run: npm run build
      - name: Locate generated Wrangler configuration
        id: config
        run: |
          set -euo pipefail
          mapfile -t configs < <(find .output -type f \( -name wrangler.json -o -name wrangler.jsonc \) -print)
          if [ "${#configs[@]}" -ne 1 ]; then echo "Expected exactly one generated Wrangler config."; exit 1; fi
          echo "path=${configs[0]}" >> "$GITHUB_OUTPUT"
      - name: Configure isolated Group 05 migration
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/configure-group05-production.mjs "${{ steps.config.outputs.path }}"
      - name: Validate isolated migration configuration
        env:
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const config=JSON.parse(fs.readFileSync(process.env.CONFIG_PATH,"utf8"));
          const d1=(config.d1_databases??[]).filter(x=>x.binding==="ACTION_DB");
          if(d1.length!==1||!d1[0].database_id||!d1[0].database_name)throw new Error("ACTION_DB binding invalid");
          const dir=path.resolve(path.dirname(process.env.CONFIG_PATH),d1[0].migrations_dir??"migrations");
          if(dir!==path.resolve("migrations/group05"))throw new Error("Unexpected migration directory");
          const files=fs.readdirSync(dir).filter(x=>x.endsWith(".sql"));
          if(files.length!==1||files[0]!=="0005_memory_foundation.sql")throw new Error("Unexpected migration files");
          console.log("Validated isolated Group 05 migration configuration.");
          NODE
      - name: Apply only Group 05 D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: npx --yes wrangler@4.162.0 d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config "${{ steps.config.outputs.path }}"
      - name: Verify Group 05 production D1 schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          SQL="SELECT CASE WHEN
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='users')
            AND EXISTS(SELECT 1 FROM pragma_table_info('users') WHERE name='id')
            AND EXISTS(SELECT 1 FROM pragma_table_info('users') WHERE name='email')
            AND EXISTS(SELECT 1 FROM pragma_table_info('users') WHERE name='deleted_at')
            AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='workspaces')
            AND EXISTS(SELECT 1 FROM pragma_table_info('workspaces') WHERE name='owner_user_id')
            AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='workspace_members')
            AND EXISTS(SELECT 1 FROM pragma_table_info('workspace_members') WHERE name='role')
            AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='sessions')
            AND EXISTS(SELECT 1 FROM pragma_table_info('sessions') WHERE name='token_hash')
            AND EXISTS(SELECT 1 FROM pragma_table_info('sessions') WHERE name='revoked_at')
            AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='auth_login_attempts')
            AND EXISTS(SELECT 1 FROM pragma_table_info('auth_login_attempts') WHERE name='attempts')
            AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='memories')
            THEN 'GROUP05_SCHEMA_OK' ELSE 'GROUP05_SCHEMA_INVALID' END AS schema_status;"
          OUTPUT="$(npx --yes wrangler@4.162.0 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config "${{ steps.config.outputs.path }}" --command "$SQL" 2>&1)" || { printf '%s\n' "$OUTPUT"; exit 1; }
          printf '%s\n' "$OUTPUT"
          if ! grep -q 'GROUP05_SCHEMA_OK' <<< "$OUTPUT"; then
            echo "Group 05 production D1 schema verification failed."
            exit 1
          fi
          echo "Group 05 production D1 schema verified (read-only)."
      - name: Configure first-party authentication secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIZA_AUTH_EMAIL: ${{ secrets.LIZA_AUTH_EMAIL }}
          LIZA_AUTH_PASSWORD_HASH: ${{ secrets.LIZA_AUTH_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          printf %s "$LIZA_AUTH_EMAIL" | npx --yes wrangler@4.162.0 secret put LIZA_AUTH_EMAIL --config "${{ steps.config.outputs.path }}"
          printf %s "$LIZA_AUTH_PASSWORD_HASH" | npx --yes wrangler@4.162.0 secret put LIZA_AUTH_PASSWORD_HASH --config "${{ steps.config.outputs.path }}"
      - name: Deploy Group 05 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --config "${{ steps.config.outputs.path }}"
