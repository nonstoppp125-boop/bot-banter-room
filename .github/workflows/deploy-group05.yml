name: Group 05 Production Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Authorize Group 05 production migration and deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doot-group05-production
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Require explicit Group 05 release approval
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_RELEASE" != "true" ]; then
            echo "Release not authorized. Set confirm_release to true and run again."
            exit 1
          fi
          echo "Explicit Group 05 production approval confirmed."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          CF_ACCESS_ALLOWED_EMAIL_DOMAINS: ${{ secrets.CF_ACCESS_ALLOWED_EMAIL_DOMAINS }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_NAME CLOUDFLARE_D1_DATABASE_ID CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD CF_ACCESS_ALLOWED_EMAIL_DOMAINS; do
            if [ -z "${!key:-}" ]; then echo "Missing required secret: $key"; exit 1; fi
          done

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Group 05 release tests
        # The task-approval test requires a later Manager group absent from this release.
        run: npm test -- --exclude src/test/task-approval.test.ts

      - name: Build production Worker
        run: npm run build

      - name: Locate generated Wrangler configuration
        id: config
        run: |
          set -euo pipefail
          mapfile -t configs < <(find .output -type f \( -name wrangler.json -o -name wrangler.jsonc \) -print)
          if [ "${#configs[@]}" -ne 1 ]; then
            echo "Expected exactly one generated Wrangler config; found ${#configs[@]}."
            exit 1
          fi
          echo "path=${configs[0]}" >> "$GITHUB_OUTPUT"

      - name: Configure isolated Group 05 migration and Access bindings
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          CF_ACCESS_ALLOWED_EMAIL_DOMAINS: ${{ secrets.CF_ACCESS_ALLOWED_EMAIL_DOMAINS }}
        run: node scripts/configure-group05-production.mjs "${{ steps.config.outputs.path }}"

      - name: Validate production release configuration
        env:
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
          const d1 = (config.d1_databases ?? []).filter((item) => item.binding === "ACTION_DB");
          if (d1.length !== 1 || !d1[0].database_id || !d1[0].database_name) {
            throw new Error("ACTION_DB binding is missing or invalid.");
          }
          if (d1[0].migrations_dir !== "migrations/group05") {
            throw new Error("Refusing to apply any migration directory other than migrations/group05.");
          }
          for (const key of ["CF_ACCESS_TEAM_DOMAIN", "CF_ACCESS_AUD", "CF_ACCESS_ALLOWED_EMAIL_DOMAINS"]) {
            if (typeof config.vars?.[key] !== "string" || !config.vars[key]) {
              throw new Error("Required Cloudflare Access variable is missing: " + key);
            }
          }
          if (!config.previews || typeof config.previews !== "object" || Array.isArray(config.previews)) {
            throw new Error("Generated Wrangler config is missing the required previews object.");
          }
          console.log("Validated ACTION_DB, isolated Group 05 migrations, Access variables and previews.");
          NODE

      - name: Apply only Group 05 D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: npx --yes wrangler@4.162.0 d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config "${{ steps.config.outputs.path }}"

      - name: Deploy Group 05 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --config "${{ steps.config.outputs.path }}"
